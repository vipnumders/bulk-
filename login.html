<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — BulkChat Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { wa:{DEFAULT:'#25D366',dark:'#1DA851',deep:'#075E54'}, ink:'#0B1410', paper:'#F6FAF8' },
    fontFamily: { display:['Sora','sans-serif'], body:['Inter','sans-serif'] },
    borderRadius: { xl2:'20px' },
    boxShadow: { softlg:'0 20px 60px rgba(7,94,84,0.16)' }
  }}}
</script>
<style>
  body{font-family:'Inter',sans-serif;}
  h1{font-family:'Sora',sans-serif;}
  .glass{background:rgba(255,255,255,0.75); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.5);}
  .shake{animation:shake .35s;}
  @keyframes shake{ 20%,60%{transform:translateX(-6px);} 40%,80%{transform:translateX(6px);} }
  #errorBox, #infoBox{display:none;}
  .spinner{width:16px; height:16px; border:2px solid rgba(255,255,255,.5); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:-3px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body class="min-h-screen bg-paper flex items-center justify-center p-6 relative overflow-hidden">

  <div class="absolute inset-0 -z-10 bg-[radial-gradient(900px_500px_at_80%_-10%,rgba(37,211,102,0.18),transparent)]"></div>

  <div class="w-full max-w-md">
    <div class="flex items-center justify-center gap-2 font-display font-extrabold text-2xl mb-8">
      <span class="w-10 h-10 rounded-xl bg-gradient-to-br from-wa to-wa-deep flex items-center justify-center text-white text-lg">💬</span>
      BulkChat <span class="text-wa-dark">Pro</span>
    </div>

    <div class="glass rounded-xl2 shadow-softlg p-8">
      <h1 id="formTitle" class="font-display font-bold text-2xl mb-1">Welcome back</h1>
      <p class="text-sm text-ink/60 mb-6">Sign in to reach your campaigns dashboard.</p>

      <!-- Google sign-in -->
      <button id="googleBtn" type="button" class="w-full flex items-center justify-center gap-3 border border-black/15 bg-white rounded-full py-3 font-semibold text-sm hover:bg-black/5 transition mb-5">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3 mb-5">
        <div class="h-px bg-black/10 flex-1"></div>
        <span class="text-xs text-ink/40">or use email</span>
        <div class="h-px bg-black/10 flex-1"></div>
      </div>

      <form id="authForm" novalidate class="space-y-4">
        <div>
          <label class="text-sm font-medium block mb-1.5" for="email">Email</label>
          <input id="email" type="email" placeholder="you@company.com" class="w-full px-4 py-3 rounded-lg border border-black/10 bg-white/70">
          <p id="emailErr" class="hidden text-xs text-red-500 mt-1">Enter a valid email address.</p>
        </div>
        <div>
          <label class="text-sm font-medium block mb-1.5" for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border border-black/10 bg-white/70">
          <p id="passErr" class="hidden text-xs text-red-500 mt-1">Password must be at least 6 characters.</p>
        </div>
        <p id="errorBox" class="text-sm text-red-500 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></p>
        <p id="infoBox" class="text-sm text-wa-dark bg-green-50 border border-green-200 rounded-lg px-3 py-2"></p>
        <button id="submitBtn" type="submit" class="w-full py-3.5 rounded-full font-semibold text-white bg-wa hover:bg-wa-dark shadow-lg shadow-wa/30 hover:-translate-y-0.5 transition flex items-center justify-center gap-2">
          <span id="submitLabel">Log In</span>
        </button>
      </form>

      <p class="text-xs text-center text-ink/50 mt-6">
        <span id="toggleText">Don't have an account?</span>
        <button id="toggleModeBtn" type="button" class="text-wa-deep font-semibold hover:underline">Sign up</button>
      </p>
    </div>
    <p class="text-center text-sm text-ink/50 mt-6"><a href="index.html" class="text-wa-deep font-semibold hover:underline">← Back to home</a></p>
  </div>

<script type="module">
  import {
    auth, googleProvider, ensureUserProfile,
    signInWithPopup, signInWithRedirect, getRedirectResult,
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    onAuthStateChanged
  } from './firebase-config.js';

  const form = document.getElementById('authForm');
  const card = form.closest('.glass');
  const errorBox = document.getElementById('errorBox');
  const infoBox = document.getElementById('infoBox');
  const submitBtn = document.getElementById('submitBtn');
  const submitLabel = document.getElementById('submitLabel');
  const googleBtn = document.getElementById('googleBtn');
  const googleBtnOriginalHTML = googleBtn ? googleBtn.innerHTML : '';

  let mode = 'login'; // 'login' | 'signup'

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    infoBox.style.display = 'none';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
  function showInfo(msg){
    infoBox.textContent = msg;
    infoBox.style.display = 'block';
    errorBox.style.display = 'none';
  }
  function friendlyError(err){
    const map = {
      'auth/invalid-email': 'Please enter a valid email address.',
      'auth/user-not-found': 'No account found with that email. Try signing up instead.',
      'auth/wrong-password': 'Incorrect password. Please try again.',
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/email-already-in-use': 'An account already exists with that email. Try logging in instead.',
      'auth/weak-password': 'Password should be at least 6 characters.',
      'auth/popup-closed-by-user': 'Google sign-in was closed before completing.',
      'auth/popup-blocked': 'Google sign-in popup was blocked by your browser. Please allow popups and try again.',
      'auth/operation-not-allowed': 'This sign-in method is not enabled in Firebase Console (Authentication → Sign-in method).',
      'auth/user-disabled': 'This user account has been disabled.',
      'auth/account-exists-with-different-credential': 'An account already exists with the same email using a different sign-in method.',
      'auth/too-many-requests': 'Too many failed login attempts. Access temporarily disabled. Try again later.',
      'auth/invalid-api-key': 'Invalid Firebase API Key in firebase-config.js.',
      'auth/unauthorized-domain': 'This domain is not authorized in Firebase yet. Add it under Authentication → Settings → Authorized domains.',
      'auth/network-request-failed': 'Network error — check your connection and try again.'
    };
    return map[err.code] || err.message || 'Something went wrong. Please try again.';
  }

  // Handle Google redirect sign-in completion if triggered via redirect fallback
  getRedirectResult(auth).then(async (result) => {
    if (result && result.user) {
      showInfo('Success — redirecting…');
      try { await ensureUserProfile(result.user); } catch(e){}
      window.location.href = 'dashboard.html';
    }
  }).catch((err) => {
    if (err && err.code) showError(friendlyError(err));
  });

  document.getElementById('toggleModeBtn').addEventListener('click', ()=>{
    mode = mode === 'login' ? 'signup' : 'login';
    document.getElementById('formTitle').textContent = mode === 'login' ? 'Welcome back' : 'Create your account';
    submitLabel.textContent = mode === 'login' ? 'Log In' : 'Sign Up';
    document.getElementById('toggleText').textContent = mode === 'login' ? "Don't have an account?" : 'Already have an account?';
    document.getElementById('toggleModeBtn').textContent = mode === 'login' ? 'Sign up' : 'Log in';
    errorBox.style.display = 'none';
    infoBox.style.display = 'none';
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const emailOk = emailRe.test(email);
    const passOk  = pass.length >= 6;

    document.getElementById('emailErr').classList.toggle('hidden', emailOk);
    document.getElementById('passErr').classList.toggle('hidden', passOk);
    if(!emailOk || !passOk){
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      return;
    }

    submitBtn.disabled = true;
    submitLabel.innerHTML = '<span class="spinner"></span>';

    try{
      let cred;
      if(mode === 'login'){
        cred = await signInWithEmailAndPassword(auth, email, pass);
      } else {
        cred = await createUserWithEmailAndPassword(auth, email, pass);
      }
      if(cred && cred.user){
        ensureUserProfile(cred.user).catch(()=>{});
      }
      showInfo('Success — redirecting…');
      window.location.href = 'dashboard.html';
    } catch(err){
      showError(friendlyError(err));
      submitBtn.disabled = false;
      submitLabel.textContent = mode === 'login' ? 'Log In' : 'Sign Up';
    }
  });

  googleBtn.addEventListener('click', async ()=>{
    googleBtn.disabled = true;
    googleBtn.innerHTML = '<span class="spinner" style="border-top-color:#075E54; border-color:rgba(7,94,84,0.3)"></span> Connecting…';
    try{
      const res = await signInWithPopup(auth, googleProvider);
      if(res && res.user){
        ensureUserProfile(res.user).catch(()=>{});
      }
      showInfo('Success — redirecting…');
      window.location.href = 'dashboard.html';
    } catch(err){
      if(err && err.code === 'auth/popup-blocked'){
        showInfo('Popup blocked — redirecting to Google sign-in…');
        try {
          await signInWithRedirect(auth, googleProvider);
          return;
        } catch(redirectErr){
          showError(friendlyError(redirectErr));
        }
      } else {
        showError(friendlyError(err));
      }
      googleBtn.disabled = false;
      googleBtn.innerHTML = googleBtnOriginalHTML;
    }
  });

  // If already signed in, skip straight to dashboard
  onAuthStateChanged(auth, (user)=>{
    if(user) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
